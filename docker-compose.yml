services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"IF EXISTS (SELECT 1 FROM sys.databases WHERE state <> 0) RAISERROR('databases not online', 16, 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - commerce-network

  order-api:
    build:
      context: .
      dockerfile: src/Services/CommerceCore.Ordering.Api/Dockerfile
    container_name: order-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OrdersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Services__Catalog__BaseUrl: http://catalog-api:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-commerce}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "5001:8080"
      - "127.0.0.1:15001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - commerce-network

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/CommerceCore.Catalog.Api/Dockerfile
    container_name: catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-commerce}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "5002:8080"
      - "127.0.0.1:15002:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - commerce-network

  payments-api:
    build:
      context: .
      dockerfile: src/Services/CommerceCore.Payments.Api/Dockerfile
    container_name: payments-api
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=PaymentsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-commerce}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - commerce-network

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/CommerceCore.Gateway/Dockerfile
    container_name: gateway
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__catalog__Destinations__primary__Address: http://catalog-api:8080/
      ReverseProxy__Clusters__ordering__Destinations__primary__Address: http://order-api:8080/
      ReverseProxy__Clusters__payments__Destinations__primary__Address: http://payments-api:8080/
      ReverseProxy__Clusters__notifications__Destinations__primary__Address: http://notifications-api:8080/
    ports:
      - "8080:8080"
    networks:
      - commerce-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-commerce}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - commerce-network

  notifications-api:
    build:
      context: .
      dockerfile: src/Services/CommerceCore.Notifications.Api/Dockerfile
    container_name: notifications-api
    restart: on-failure
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=NotificationsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-commerce}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:15004:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - commerce-network

networks:
  commerce-network:
    driver: bridge

volumes:
  sqlserver_data:
  rabbitmq_data:
