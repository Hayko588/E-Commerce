services:
  sqlserver-orders:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-orders
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_orders_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - commerce-network

  sqlserver-catalog:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-catalog
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_catalog_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - commerce-network

  order-api:
    build:
      context: .
      dockerfile: src/Services/CommerceCore.Ordering.Api/Dockerfile
    container_name: order-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver-orders;Database=OrdersDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5001:8080"
    depends_on:
      sqlserver-orders:
        condition: service_healthy
    networks:
      - commerce-network

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/CommerceCore.Catalog.Api/Dockerfile
    container_name: catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver-catalog;Database=CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "5002:8080"
    depends_on:
      sqlserver-catalog:
        condition: service_healthy
    networks:
      - commerce-network

networks:
  commerce-network:
    driver: bridge

volumes:
  sqlserver_orders_data:
  sqlserver_catalog_data:
