apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: commerce-core

resources:
  - namespace.yaml
  - config.yaml
  - sqlserver.yaml
  - rabbitmq.yaml
  - dbinit.yaml
  - migrations/orders.yaml
  - migrations/catalog.yaml
  - migrations/payments.yaml
  - migrations/notifications.yaml
  - networkpolicies.yaml
  - apps/ordering-api.yaml
  - apps/catalog-api.yaml
  - apps/payments-api.yaml
  - apps/notifications-api.yaml
  - apps/gateway.yaml
  - ingress.yaml
  - observability.yaml

configMapGenerator:
  - name: sql-init-script
    files:
      - init-db.sql=files/init-db.sql
    options:
      disableNameSuffixHash: true
      labels:
        commerce.io/stage: dbinit

patches:
  - target:
      kind: Deployment
      labelSelector: commerce.io/stage=apps
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/commerce.io~1needs-otel
        value: "true"
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: observability-config
            optional: true