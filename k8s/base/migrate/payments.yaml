apiVersion: batch/v1
kind: Job
metadata:
  name: payments-migrate
  labels:
    app.kubernetes.io/name: payments-migrate
    app.kubernetes.io/part-of: commerce-core
    commerce.io/stage: migrate
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-migrate
        app.kubernetes.io/part-of: commerce-core
        commerce.io/needs-db: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: efbundle
          image: payments-migrator
          envFrom:
            - configMapRef:
                name: commerce-config
          env:
            - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
              value: /tmp/bundle
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: commerce-secrets
                  key: PAYMENTS_MIGRATOR_CONN
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
