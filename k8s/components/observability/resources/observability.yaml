# Opt-in: only applied by the "observability" stage. The apps read observability-config as an optional
# ConfigMap, so without this file they simply don't export anything.
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  labels:
    app.kubernetes.io/part-of: commerce-core
    commerce.io/stage: observability
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/name: lgtm
    app.kubernetes.io/part-of: commerce-core
    commerce.io/stage: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
        app.kubernetes.io/part-of: commerce-core
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:latest      # development backend; see the digest-pinning note below
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}                          # data is lost when the pod restarts; fine for a dev backend
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/name: lgtm
    app.kubernetes.io/part-of: commerce-core
    commerce.io/stage: observability
spec:
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-to-lgtm
  labels:
    app.kubernetes.io/part-of: commerce-core
    commerce.io/stage: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              commerce.io/needs-otel: "true"
      ports:
        - port: 4317
        - port: 4318