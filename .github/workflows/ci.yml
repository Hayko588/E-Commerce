name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: E-Commerce.sln

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Check for vulnerable packages
        shell: bash
        run: |
          dotnet list ${{ env.SOLUTION }} package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found. See the log above."
            exit 1
          fi

      - name: Check EF migrations match the models
        shell: bash
        env:
          # Only needed so the app can be constructed; no database connection is made.
          ConnectionStrings__DefaultConnection: "Server=ci;Database=ci;User Id=ci;Password=ci;TrustServerCertificate=True"
          RabbitMq__Password: ci
        run: |
          dotnet tool restore
          for svc in Ordering Catalog; do
            dotnet ef migrations has-pending-model-changes \
              --project src/Services/CommerceCore.$svc.Infrastructure \
              --startup-project src/Services/CommerceCore.$svc.Api \
              --configuration Release --no-build \
              -- --environment Development
          done

      - name: Unit tests
        run: >
          dotnet test tests/CommerceCore.Ordering.UnitTests -c Release --no-build
          --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      # Testcontainers starts a real SQL Server; Docker is preinstalled on ubuntu-latest
      - name: Integration tests
        run: >
          dotnet test tests/CommerceCore.Ordering.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Catalog unit tests
        run: >
          dotnet test tests/CommerceCore.Catalog.UnitTests -c Release --no-build
          --logger "trx;LogFileName=catalog-unit.trx" --results-directory TestResults

      - name: Catalog integration tests
        run: >
          dotnet test tests/CommerceCore.Catalog.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=catalog-integration.trx" --results-directory TestResults
      
      - name: Payments unit tests
        run: >
          dotnet test tests/CommerceCore.Payments.UnitTests -c Release --no-build
          --logger "trx;LogFileName=payments-unit.trx" --results-directory TestResults
        
      - name: Notifications unit tests
        run: >
          dotnet test tests/CommerceCore.Notifications.UnitTests -c Release --no-build
          --logger "trx;LogFileName=notifications-unit.trx" --results-directory TestResults

      - name: Gateway tests
        run: >
          dotnet test tests/CommerceCore.Gateway.IntegrationTests -c Release --no-build
          --logger "trx;LogFileName=gateway.trx" --results-directory TestResults

      - name: End-to-end tests (real SQL Server and RabbitMQ)
        run: >
          dotnet test tests/CommerceCore.EndToEnd.Tests -c Release --no-build
          --logger "trx;LogFileName=e2e.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify formatting
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --verbosity detailed

  docker:
    needs: [build-test, format]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ordering-api
            dockerfile: src/Services/CommerceCore.Ordering.Api/Dockerfile
          - name: catalog-api
            dockerfile: src/Services/CommerceCore.Catalog.Api/Dockerfile
          - name: gateway
            dockerfile: src/Gateway/CommerceCore.Gateway/Dockerfile
          - name: payments-api
            dockerfile: src/Services/CommerceCore.Payments.Api/Dockerfile
          - name: notifications-api
            dockerfile: src/Services/CommerceCore.Notifications.Api/Dockerfile
          - name: ordering-migrator
            dockerfile: src/Services/CommerceCore.Ordering.Api/Dockerfile
            target: migrator
          - name: catalog-migrator
            dockerfile: src/Services/CommerceCore.Catalog.Api/Dockerfile
            target: migrator
          - name: payments-migrator
            dockerfile: src/Services/CommerceCore.Payments.Api/Dockerfile
            target: migrator
          - name: notifications-migrator
            dockerfile: src/Services/CommerceCore.Notifications.Api/Dockerfile
            target: migrator
    env:
      PUSH: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'master') }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lower-case image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  k8s-smoke:
    needs: [build-test, format]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: bash scripts/build-images.sh all | tee images.txt

      - name: Create a kind cluster and load the images
        run: |
          kind version
          kind create cluster --name commerce --wait 180s
          xargs kind load docker-image --name commerce < images.txt

      - name: Deploy the platform (same script as local development)
        run: bash scripts/k8s-deploy.sh local infra dbinit migrate apps

      - name: Smoke test through the gateway
        run: |
          kubectl -n commerce-core port-forward svc/gateway 8088:8080 >/dev/null 2>&1 &
          forward=$!
          trap 'kill $forward' EXIT
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8088/health/live && break
            sleep 1
          done
          bash scripts/smoke-test.sh http://127.0.0.1:8088

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n commerce-core get pods -o wide || true
          kubectl -n commerce-core get events --sort-by=.lastTimestamp | tail -40 || true
          for d in ordering-api catalog-api payments-api notifications-api gateway; do
            echo "::group::logs $d"
            kubectl -n commerce-core logs deploy/$d --tail=80 || true
            echo "::endgroup::"
          done

  deploy:
    needs: [docker, k8s-smoke]
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production       # required reviewers are configured on this environment
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # never abort a deployment halfway
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version --client

      - name: Pin the images to this commit
        working-directory: k8s/overlays/prod
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for name in ordering-api catalog-api payments-api notifications-api gateway \
                      ordering-migrator catalog-migrator payments-migrator notifications-migrator; do
            kustomize edit set image "$name=$repo/$name:${GITHUB_SHA}"
          done

      - name: Deploy (infra, database init, migrations, apps)
        run: bash scripts/k8s-deploy.sh prod

      - name: Verify
        run: |
          kubectl -n commerce-core get pods
          curl -fsS "https://${{ vars.COMMERCE_HOST }}/health/ready"