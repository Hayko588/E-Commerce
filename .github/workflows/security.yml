name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 5 * * 1"    # Mondays, 05:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ordering-api:scan .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@PASTE_FULL_COMMIT_SHA_HERE   # v0.35.0
        with:
          image-ref: ordering-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"